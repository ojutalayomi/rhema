name: Release (Windows)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - onyx: false
            args: "--target x86_64-pc-windows-msvc -- --no-default-features"

          - onyx: true
            args: "--target x86_64-pc-windows-msvc -- --no-default-features --features onnx"

    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - name: Download rhema.db data release
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download data-v1 `
            --repo ojutalayomi/rhema `
            --pattern "rhema.db" `
            --output data/rhema.db

      - name: Cache Whisper GGML model
        if: matrix.onyx == true
        uses: actions/cache@v4
        id: whisper-model
        with:
          path: models/whisper/ggml-large-v3-turbo-q8_0.bin
          key: whisper-ggml-large-v3-turbo-q8_0-bin

      - name: Install dependencies
        run: bun install

      - name: Download Whisper model (bundled for local STT)
        if: matrix.onyx == true && steps.whisper-model.outputs.cache-hit != 'true'
        run: bun run download:whisper

      - name: Sync version from tag
        run: bun run scripts/set-version-from-tag.ts --tag "${{ github.ref_name }}"

      - name: Use dynamic CRT for onyx build (matches prebuilt ORT Runtime library)
        # The prebuilt ONNX Runtime binaries downloaded by ort-sys are compiled with
        # /MD (MD_DynamicRelease). Other native deps (esaxx-rs, etc.) default to /MT
        # (MT_StaticRelease). MSVC refuses to link the two — LNK2038. Switching the
        # whole build to -crt-static=false (/MD) resolves the mismatch.
        # The cc crate reads CARGO_ENCODED_RUSTFLAGS (derived from RUSTFLAGS) to pick
        # /MT vs /MD for C/C++ build scripts, so one flag covers both Rust and C code.
        if: matrix.onyx == true
        shell: pwsh
        run: |
          echo "RUSTFLAGS=-C target-feature=-crt-static" >> $env:GITHUB_ENV

      - name: Set product name for onyx variant
        if: matrix.onyx == true
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.productName = "Rhema-onyx"
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

      - name: Strip bundled models and model-download from non-onyx build
        # Non-onyx builds compile with --no-default-features (no whisper, no onnx).
        # Remove the whisper model from bundle.resources so tauri does not try to
        # bundle a file that was never downloaded, and strip the download prefix from
        # beforeBuildCommand so it does not trigger a 874 MB download mid-build.
        if: matrix.onyx == false
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.bundle.resources = [PSCustomObject]@{ "../data/rhema.db" = "rhema.db" }
          $conf.build.beforeBuildCommand = "bun run build"
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json

      - name: Build and upload to GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Rhema ${{ github.ref_name }}
          releaseBody: |
            See the assets below to download this version.

            Two variants are available per platform:
            - **Rhema** – without the Onyx model (smaller download, cloud inference)
            - **Rhema-onyx** – with the Onyx model bundled (larger download, local inference)

            **Note:** Windows builds are currently unsigned and may show SmartScreen warnings on first open.
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
